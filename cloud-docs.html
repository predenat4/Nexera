<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez les nouvelles ressources NeXera.">
  <title>Nouveautés — Bibliothèque NeXera</title>
  <link rel="stylesheet" href="style2.css">
  <link rel="icon" href="logo.jpg">
</head>
<body data-requires-auth="true">
  <header class="top-header">
    <div class="header-left">
      <img class="brand-logo" src="logo.jpg" alt="Logo NeXera">
      <h1 class="header-title">NeXera</h1>
    </div>
    <div class="header-actions">
      <a href="document2.html" class="button-secondary">Retour aux ressources</a>
    </div>
  </header>
  <main>
    <section class="section">
      <h2>Nouveautés (Cloud)</h2>
      <p>Documents ajoutés récemment à la plateforme.</p>
      
      <div id="documentsList" class="content-grid">
        <p>Chargement des documents...</p>
      </div>
    </section>
  </main>
  <footer><p>© 2026 NeXera — Tous droits réservés</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="script.js"></script>
  <script type="module">
    async function loadDocuments() {
      const list = document.getElementById('documentsList');
      const files = await window.fetchDocuments();
      
      if (files.length === 0) {
        list.innerHTML = '<p>Aucun document trouvé dans le stockage.</p>';
        return;
      }
      
      const bucketUrl = "https://xgyxmumkgxcangelvrri.supabase.co/storage/v1/object/public/documents/";
      
      list.innerHTML = files.map(file => `
        <article class="content-card">
          <h3>${file.name.replace('.pdf', '')}</h3>
          <a href="${bucketUrl}${file.name}" target="_blank">Lire →</a>
        </article>
      `).join('');
    }
    
    loadDocuments();
  </script>
</body>
</html>
