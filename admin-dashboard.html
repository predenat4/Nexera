<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin | NeXera</title>
  <link rel="stylesheet" href="style2.css">
  <link rel="icon" href="logo.jpg">
  <style>
    :root {
        --bg: #0d0f16;
        --cyan: #4ec8ff;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{min-height:100%;}
    body{
        padding:24px;
        font-family:'Inter', -apple-system, sans-serif;
        color:#f2f4f8;
        background-color: var(--bg);
    }

    /* Arrière-plan flouté */
    .bg-img {
        position: fixed;
        inset: -20px;
        background-image: url('arriereplan.jpg');
        background-size: cover;
        background-position: center;
        filter: blur(15px);
        z-index: -1;
        transform: scale(1.1);
    }

    .dashboard-layout { max-width: 1200px; margin: 0 auto; }
    
    .dashboard-intro { margin-bottom: 40px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }
    .muted { color: #a9c1c7; }

    /* Grid layout pour les cartes membres */
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 30px;
    }
    
    /* Style carte membre (glassmorphism) */
    .member-card {
        padding: 50px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.1);
        color: #fff;
        font-weight: bold;
    }
    
    .member-card h3 { margin-bottom: 20px; color: #fff; font-size: 1.5rem; }
    
    /* Styles barres de progression */
    .progress-group { margin-bottom: 20px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 8px; color: #fff; font-weight: bold; }
    .progress-bar { width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-bar span { display: block; height: 100%; background: var(--cyan); border-radius: 4px; }

    .admin-back-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 25px;
        border-radius: 20px;
        background: transparent;
        border: 1px solid var(--cyan);
        color: var(--cyan);
        text-decoration: none;
        font-weight: bold;
        transition: all 0.3s;
    }
    .admin-back-btn:hover { background: var(--cyan); color: #0d0f16; }
  </style>
</head>
<body>
  <div class="bg-img"></div>
  
  <main class="dashboard-layout">
    <div class="dashboard-content">
      <section class="dashboard-intro">
        <h1>Panneau Administrateur</h1>
        <div id="statsSummary" class="muted" style="font-size: 1.1rem; margin-top: 10px;">Chargement des statistiques...</div>
        <a href="dashboard.html" class="admin-back-btn">Retour au site</a>
      </section>

      <section class="admin-stats-grid" id="statsGrid">
        <!-- Cartes membres générées dynamiquement -->
      </section>
    </div>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="script.js"></script>
    <script>
        // Vérification session admin
        if (!localStorage.getItem('adminToken')) {
            window.location.href = 'admin-stats.html';
        }
        
        async function loadAdminData() {
            const password = localStorage.getItem('adminPassword'); 
            const statsGrid = document.getElementById('statsGrid');
            
            try {
                const data = await window.fetchAdminStats(password);
                
                const now = new Date();
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

                // Calcul des nouvelles statistiques
                const totalMembers = data.length;
                const activeMembers = data.filter(u => (u.progress || 0) > 0).length;
                document.getElementById('statsSummary').innerHTML = `
                    <strong>${totalMembers}</strong> membres au total
                `;

                statsGrid.innerHTML = data.map(u => {
                    const weeklyPerc = Math.min(100, Math.floor(((u.weekly_completions || 0) / 7) * 100));
                    const monthlyPerc = Math.min(100, Math.floor(((u.monthly_completions || 0) / daysInMonth) * 100));
                    const annualPerc = Math.min(100, Math.floor(((u.anual_cpmpletions || 0) / 365) * 100));

                    return `
                        <article class="member-card">
                            <h3>NOM: ${u.name}</h3>
                            <div class="progress-group">
                                <div class="progress-label">Progression globale: <span>${u.progress || 0}%</span></div>
                                <div class="progress-bar"><span style="width: ${u.progress || 0}%"></span></div>
                            </div>
                            <div class="progress-group">
                                <div class="progress-label">Jours validés (streak): <span>${u.streak || 0}</span></div>
                            </div>
                            <div class="progress-group">
                                <div class="progress-label">Hebdomadaire: <span>${weeklyPerc}%</span></div>
                                <div class="progress-bar"><span style="width: ${weeklyPerc}%"></span></div>
                            </div>
                            <div class="progress-group">
                                <div class="progress-label">Mensuel: <span>${monthlyPerc}%</span></div>
                                <div class="progress-bar"><span style="width: ${monthlyPerc}%"></span></div>
                            </div>
                            <div class="progress-group">
                                <div class="progress-label">Annuel: <span>${annualPerc}%</span></div>
                                <div class="progress-bar"><span style="width: ${annualPerc}%"></span></div>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (e) {
                console.error("Erreur de chargement", e);
                statsGrid.innerHTML = '<p class="muted">Erreur lors du chargement des données.</p>';
            }
        }
        
        window.addEventListener('load', loadAdminData);
    </script>
</body>
</html>
